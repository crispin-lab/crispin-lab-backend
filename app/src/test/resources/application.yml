# datasource 는 main yml 을 shadow 한 뒤 @ServiceConnection 가 컨테이너 값으로 다시 override.
spring:
  application:
    name: crispin-lab
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/lab
    username: overridden-by-testcontainers
    password: overridden-by-testcontainers
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: overridden-by-testcontainers
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
