# datasource 는 @ServiceConnection (TestcontainersConfig) 가 런타임에 override 한다.
# 본 placeholder 는 main yml 의 `${POSTGRES_*}` resolution 실패만 막기 위한 stub.
spring:
  application:
    name: crispin-lab
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/lab
    username: overridden-by-testcontainers
    password: overridden-by-testcontainers
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
