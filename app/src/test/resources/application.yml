# 본 파일은 main yml 의 datasource 설정을 test classpath 에서 shadow 한다 (머지 아님).
# datasource url/username/password 는 다시 @ServiceConnection (TestcontainersConfig) 가
# 런타임에 실제 Testcontainers 컨테이너 값으로 override 한다.
spring:
  application:
    name: crispin-lab
  datasource:
    url: jdbc:postgresql://overridden-by-testcontainers/lab
    username: overridden-by-testcontainers
    password: overridden-by-testcontainers
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
