[versions]
kotlin = "2.3.21"
kotest = "6.1.11"
kotlinter = "5.4.2"
spring-boot = "3.5.14"
kotlin-snowflake = "1.0.1"
kotlin-serialization = "1.8.0"
exposed = "1.2.0"
rest-assured = "6.0.0"
restdocs-api-spec = "0.19.4"
swagger-models = "2.2.49"
springmockk = "5.0.1"
mockk = "1.14.9"

[libraries]
# build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
restdocs-api-spec-gradle-plugin = { module = "com.epages:restdocs-api-spec-gradle-plugin", version.ref = "restdocs-api-spec" }
swagger-models = { module = "io.swagger.core.v3:swagger-models", version.ref = "swagger-models" }

# kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlin-snowflake = { module = "io.github.crispindeity:kotlin-snowflake", version.ref = "kotlin-snowflake" }

# spring (versions resolved by spring-boot-bom)
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-test = { module = "org.springframework:spring-test" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# database
exposed-spring-boot-starter = { module = "org.jetbrains.exposed:exposed-spring-boot-starter", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
# datasource drivers (version resolved by spring-boot-bom)
postgresql = { module = "org.postgresql:postgresql" }

# migration (versions resolved by spring-boot-bom)
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# test
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
rest-assured-kotlin-extensions = { module = "io.rest-assured:kotlin-extensions", version.ref = "rest-assured" }
spring-restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc" }
restdocs-api-spec-mockmvc = { module = "com.epages:restdocs-api-spec-mockmvc", version.ref = "restdocs-api-spec" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
# testcontainers (versions resolved by spring-boot-bom)
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

[plugins]
# external
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-linter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
restdocs-api-spec = { id = "com.epages.restdocs-api-spec", version.ref = "restdocs-api-spec" }

# convention (user-facing)
crispinlab-jvm = { id = "crispinlab.jvm" }
crispinlab-kopring-service = { id = "crispinlab.kopring.service" }
crispinlab-kopring-web = { id = "crispinlab.kopring.web" }
crispinlab-kopring-library = { id = "crispinlab.kopring.library" }
crispinlab-kopring-exposed = { id = "crispinlab.kopring.exposed" }
crispinlab-snowflake = { id = "crispinlab.snowflake" }
crispinlab-kotlin-serialization = { id = "crispinlab.kotlin.serialization" }
crispinlab-rest-assured = { id = "crispinlab.rest-assured" }
crispinlab-restdocs = { id = "crispinlab.restdocs" }
